name: Run Single PHPUnit Test

on:
  workflow_dispatch:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodlepassword
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Moodle Core
        uses: actions/checkout@v4
        with:
          repository: moodle/moodle
          ref: MOODLE_401_STABLE

      - name: Checkout Plugin
        uses: actions/checkout@v4
        with:
          path: mod/pulse

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pgsql, intl, xml, gd, zip

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Configure Moodle PHPUnit
        run: |
          mkdir -p /tmp/moodledata
          mkdir -p /tmp/phpunitdata
          chmod -R 777 /tmp/moodledata
          chmod -R 777 /tmp/phpunitdata
          cp config-dist.php config.php
          sed -i "s/\$CFG->dbtype    = 'pgsql';/\$CFG->dbtype    = 'pgsql';/" config.php
          sed -i "s/\$CFG->dbname    = 'moodle';/\$CFG->dbname    = 'moodle';/" config.php
          sed -i "s/\$CFG->dbuser    = 'username';/\$CFG->dbuser    = 'moodle';/" config.php
          sed -i "s/\$CFG->dbpass    = 'password';/\$CFG->dbpass    = 'moodlepassword';/" config.php
          sed -i "s/\$CFG->dbhost    = 'localhost';/\$CFG->dbhost    = '127.0.0.1';/" config.php
          sed -i "s|\$CFG->wwwroot   = 'http://example.com/moodle';|\$CFG->wwwroot   = 'http://localhost';|" config.php
          sed -i "s|\$CFG->dataroot  = '/home/example/moodledata';|\$CFG->dataroot  = '/tmp/moodledata';|" config.php
          echo "\$CFG->phpunit_prefix = 'phpu_';" >> config.php
          echo "\$CFG->phpunit_dataroot = '/tmp/phpunitdata';" >> config.php

      - name: Initialize PHPUnit
        run: php admin/tool/phpunit/cli/init.php

      - name: Run Specific Test File
        run: vendor/bin/phpunit mod/pulse/tests/convert_varstime_format_test.php
